apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx-container
        image: docker.io/wissemkh1/react-web-app:1.4.0 # {"$imagepolicy":"flux-system:react-app-img-policy"}
        ports:
        - containerPort: 5173
