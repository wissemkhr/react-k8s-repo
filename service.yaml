apiVersion: v1
kind: Service
metadata:
  name: web-nodeport-service
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
    - protocol: TCP
      port: 80         # Port accessible inside the cluster
      targetPort: 5173   # Port on the container inside the pod
      nodePort: 32000  # Optional: Static external port (Range: 30000-32767)